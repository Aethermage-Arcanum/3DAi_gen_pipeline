# Zweibeiner-Raptor-Rig (rigging/biped_raptor_rig.py). Pro Kreatur überschreibbar unter [biped_raptor].
foot_band = 0.05
slice = 0.03
min_belly = 0.15
mid_half_width = 0.08
track_step = 0.03
leg_radius = 0.12
ball_height = 0.04
joint_inset = 0.6
joint_depth = 0.4
chest_ahead = 0.35       # Brust: Anteil Hüfte → Nasenspitze
head_length = 0.28       # Kopf: Anteil Hüfte → Nasenspitze
tail_base = 0.06         # Schwanzansatz hinter der Hüfte (Anteil Länge)
arm_window = [0.4, 1.0]  # Arme werden zwischen Hüfte (0) und Kopfansatz (1) gesucht
arm_min_side = 0.03      # Arm-Vertices liegen mindestens so weit seitlich der Mittellinie (Anteil H)
arm_radius = 0.08
arm_x_reach = 0.1
leg_x_reach = 0.2
leg_top_margin = 0.18
leg_capture = 0.12
falloff = 4
smooth_iterations = 6
smooth_factor = 0.5
arm_leg_clear = 0.12     # Arm-Suche hält diesen Abstand zum Hüftgelenk (Anteil L)
knee_forward = 0.05       # Knie liegt so weit vor dem Hüftgelenk (Anteil L)
knee_below_belly = 0.05   # … und so weit unter der Bauchlinie (Anteil H)
tail_clear = 0.03         # Schwanz-Gewichte erst so weit hinter der Hüfte (Anteil L)
thigh_radius = 0.10       # Oberschenkel-Bereich um das Hüftgelenk ohne Schwanz-Gewichte (Anteil L)
leg_side_min = -0.02      # Bein-Gewichte dürfen so weit über die Mittellinie (Seite entscheidet danach der nächste Bein-Knochen)
between_legs = 0.0        # Vertices, deren Abstand zu beiden Beinen sich weniger unterscheidet, gehören zum Rumpf
between_min_z = 0.1       # … aber erst oberhalb dieser Höhe (Anteil H)
cut_between_legs = true   # Tripo-Hautbrücke zwischen den Beinen löschen (reißt sonst bei jeder Gewichtung)
web_tolerance = 0.04      # „gleich weit von beiden Beinen“ (Anteil H)
web_half_width = 0.05     # nur so nah an der Mittellinie (Anteil H)
bridge_half_width = 0.12  # Flächen mit Ecken an beiden Beinen werden nur so nah an der Mittellinie gelöscht

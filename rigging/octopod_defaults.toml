# Standardwerte für das Krabbler-Rig. Jede Kreatur kann in creature.toml unter
# [octopod.detect] / [octopod.rig] einzelne Werte überschreiben.

[detect]
contact_eps = 0.012     # Kontaktpunkte zwischen Teilen: Abstand < 1,2 % der Modellgröße
neighbors = 24          # Nachbar-Suche pro Vertex (für den Spannbaum zwischen Teilen)
midline_tol = 0.02      # Teile, die die Mittellinie (y≈0) berühren, gehören zum Rumpf
ground_tol = 0.06       # Teile in den unteren 6 % der Höhe = Füße
head_fraction = 0.22    # vorderste 22 % der Länge = Kopfbereich (Fühler/Mandibeln)
# Ein-Mesh-Fallback (2026-11-21, Broodling, octopod_detect.detect_single): "auto" = nur wenn das verschweißte Mesh
# aus höchstens single_mesh_max_parts Teilen besteht. Mehrteilige Meshes (Chitin Crawler) bleiben beim Insel-Weg.
single_mesh = "auto"
single_mesh_max_parts = 3
sm_ext_min = 0.25       # Extremität = mind. 25 % der Größe über die Oberfläche von der Körpermitte entfernt
sm_tip_band = 0.12      # Fußspitze: in den unteren 12 % der Höhe (auch leicht angehobene Beine)
sm_tip_min_side = 0.08  # … und seitlich der Mitte (Fänge/Taster vorne in der Mitte zählen nicht)
sm_thick_cap = 0.09     # Querschnitt (für die Bein-Mittellinie): nur Mesh innerhalb 9 % der Größe um den Wegpunkt
sm_slab = 0.012         # Dicke der Querschnitt-Scheibe
sm_root_min_arc = 0.3   # Beinwurzel frühestens nach 30 % des Wegs Spitze → Körpermitte
sm_sdf_radius = 0.03    # Wand-Dicke (SDF) am Wegpunkt = Median der Vertices in diesem Umkreis
sm_root_sdf = 0.11      # Beinwurzel = Wand-Dicke über 11 % der Größe …
sm_root_ratio = 2.5     # … und über dem 2,5-fachen der Bein-Dicke
sm_leg_points = 12      # Punkte der Bein-Mittellinie (daraus wählt das Rig Knie, Knöchel …)
sm_leg_capture = 2.2    # Bein-Vertices: höchstens 2,2× Beinradius von der Mittellinie …
sm_leg_max_sdf = 0.11   # … und dünn (Wand-Dicke < 11 % der Größe; Kopf/Rumpf sind dicker)
sm_cut_fused = true     # von Tripo verschmolzene Stellen trennen (Bein ↔ Eierhaufen/Kopf, Bein ↔ Bein) …
sm_fuse_min_frac = 0.3  # … wenn die Verbindung weiter als 30 % der Beinlänge von der Wurzel entfernt liegt

[rig]
coxa_fraction = 0.25          # Coxa-Ende bei 25 % des Wegs Wurzel → Knie
ankle_fraction = 0.7          # Knöchel bei 70 % des Wegs Knie → Fußspitze
knee_min_fraction = 0.25      # Knie liegt zwischen 25 % …
knee_max_fraction = 0.6       # … und 60 % der Beinlänge (sonst entartete Glieder)
tarsus_max_fraction = 0.3     # Fußglied max. 30 % der Beinlänge
profile_bins = 40             # Auflösung des Rumpf-Profils (Einschnürungen = Petiolus/Hals)
profile_samples = 30000       # Oberflächenpunkte für das Profil
petiole_search_ahead = 0.1    # Petiolus darf bis 10 % der Länge vor den hintersten Beinwurzeln liegen
antenna_mid_highest = true    # Fühler-Mittelgelenk = höchster Punkt (geknickte Fühler)
spine_blend = 0.06            # weiche Übergangszone zwischen Rumpfknochen (Anteil der Größe)
rigid_island_max_verts = 0    # Rumpf-Teile kleiner als das hängen starr an einem Knochen.
                              # 0 = alle Rumpfteile weich nach Position → keine Risse zwischen Panzerplatten
leg_weight_mode = "positional" # "positional" = weiche Gelenkmanschetten (keine Lücken) · "island" = Segmente starr
joint_blend = 0.025           # Radius der Gelenkmanschette (Anteil der Größe), max. 40 % des kürzeren Glieds
root_blend = 0.04             # Rumpf-Vertices so nah an einem Bein bewegen sich anteilig mit dem Bein
root_blend_max = 0.8          # max. Anteil (bei direkter Berührung) – höher = weniger Lücke, mehr Dehnung am Rumpf
leg_blend = 0.015             # (nur Modus "island") weiche Zone bei sehr langen Bein-Teilen
split_long_leg_islands = true # Bein-Teile, die über 3+ Knochen reichen, pro Vertex aufteilen
sm_abdomen_split = 0.4        # nur Ein-Mesh (detect_single): Trennebene Vorderkörper/Hinterleib bei 40 % des Wegs
                              # Mitte der Beinwurzeln → Hinterleib-Schwerpunkt; dahinter starr an Abdomen_1
sm_abdomen_band = 0.03        # nur Ein-Mesh: Überblendung beidseits der Trennebene (Anteil der Größe)
leg_capture_ratio = 0.6      # loses Teil gehört zum Bein, wenn es < 60 % so weit vom Bein wie vom Rumpf ist

# Bewegung (Gang, Clips) liegt jetzt im Bewegungsmuster: motions/<skelett>/<muster>/style.toml


[export]
texture_size = 1024        # Tripo liefert 2048² – für Schwarmgegner reicht 512–1024
clip_name = "Walk"

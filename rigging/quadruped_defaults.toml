# Vierbeiner-Rig (rigging/quadruped_rig.py). Pro Kreatur überschreibbar in creature.toml unter [quadruped.*].
# Längen als Anteil der Höhe (H) bzw. Länge (L) des Hauptkörpers.

[detect]
foot_band = 0.05        # Vertices bis zu dieser Höhe über dem Boden gehören zu den Füßen
slice = 0.03            # Dicke der Querschnitte (Anteil L)
# spine_slice = 0.06    # optional: dickere Querschnitte nur für Wirbelsäule + Hals (grobes Low-Poly, Rimehide Bear)
min_belly = 0.12        # Querschnitte unterhalb dieser Höhe ignorieren (Beine/Boden)
mid_half_width = 0.08   # halbe Breite des Mittellinien-Streifens (Anteil H)
track_step = 0.03       # Schrittweite beim Verfolgen der Beine nach oben (Anteil H)
leg_radius = 0.12       # Suchradius um die Beinachse (Anteil H)
ball_height = 0.04      # Höhe des Fußballens über dem Boden (Anteil H)

[rig]
joint_inset = 0.6       # Schulter/Hüfte: Anteil des Abstands Mittellinie → Bein (kleiner = weiter innen)
joint_depth = 0.35      # Schulter/Hüfte: Höhe zwischen Bauch (0) und Rücken (1)
front_wrist = 0.22      # Handgelenk vorne (Anteil der Beinhöhe), falls keine Biegung gefunden
front_elbow = 0.85
back_hock = 0.32        # Sprunggelenk hinten
back_knee = 0.75
head_length = 0.42      # Kopflänge: Anteil des Abstands Schulter → Nasenspitze
# chest_extend = 0.6    # optional: Brust endet/Hals beginnt so weit (Anteil Schulter → Kopfansatz) vor der Schulter (Bär: Buckel)
tail_base = 0.12        # Schwanzansatz hinter der Hüfte (Anteil Hüfte→Schulter)
falloff = 4             # Gewichtsabfall 1/d^falloff (höher = härtere Übergänge)
leg_cross = 0.02        # Bein-Gewichte dürfen so weit über die Mittellinie reichen
leg_x_reach = 0.18      # Bein-Gewichte nur in diesem X-Bereich um Schulter/Hüfte (Anteil L)
leg_top_margin = 0.14   # Bein-Gewichte bis so weit über das Schulter-/Hüftgelenk
leg_capture = 0.10      # unterhalb des Bauchs: Vertices in diesem Radius ums Bein nur ans Bein
below_belly = 0.05
smooth_iterations = 6
smooth_factor = 0.5
neck_min_height = 0.45  # Hals-Gewichte erst ab dieser Höhe zwischen Bauch (0) und Rücken (1) …
neck_free_ahead = 0.35  # … oder weiter vorn als dieser Anteil Schulter → Kopfansatz
neck_center_width = 1.0  # seitlich davon (Schulter) keine Hals-Gewichte hinter neck_free_ahead
scapula_back = 0.05      # Schulterblatt-Oberkante liegt so weit hinter dem Schultergelenk (Anteil L)
scapula_height = 0.8     # … und so hoch zwischen Gelenk (0) und Rücken (1)
leg_top_margin_back = 0.22 # hinten weicher in die Hüfte überblenden (Oberschenkel schwingt weit)
rigid_parts = false      # true = Nebenteile starr an einem Knochen (harte Platten), false = weich überblenden
# rigid_parts_exclude = ["Jaw"]  # nur mit rigid_parts: diese Knochen nie für lose Teile wählen (Bär: Oberkiefer-Fangzähne → Head)
cut_leg_bridges = false   # Tripo-Hautbrücke zwischen linkem/rechtem Bein löschen (bei verschmolzenen Beinen einschalten)
exclusive_leg_pairs = false # jeder Vertex nur am näheren Bein eines Paares (zusammen mit cut_leg_bridges)
narrow_hind_legs = 0        # 0..1: Tripo-Hinterbeine zur Mitte schieben (1 = Hinterhufe so breit wie vorne), Mesh-Korrektur
adaptive_belly_strip = false # Bauch-Streifen schmaler als der Fußabstand (eng stehende Beine, sonst Gelenke zu tief)
# rigid_head_above = 0.02   # gesetzt: alles so weit (Anteil H) über dem Kopf-Knochen starr am Kopf (Geweih, Hörner)
# Nur wirksam zusammen mit rigid_head_above (C14, Hollow Stag) – ohne die Zeilen bleibt alles wie bisher:
# rigid_head_connected = true   # starr = über der Kopf-Oberkante UND mit dem Schädel verbunden (statt nur vor der
#                               # Schulter) → auch Geweihsprossen, die nach hinten über die Schulter ragen
# rigid_head_blend_rings = 2    # weicher Übergang starr → Hals über so viele Kanten-Ringe unter der starren Zone
# C15 Gewichte nach Körperbereichen (Wolf, Hirsch) – ohne die Zeilen bleibt alles wie bisher (Regression identisch):
# zone_lock = true           # Fremdbereich-Sperre, weich auslaufend, vor UND nach dem Glätten:
#                            #  (a) Unterbein (Leg_*_2..4) nicht über Knie/Ellbogen (+ zone_leg_margin · H)
#                            #  (b) Bein/Schulterblatt nicht auf dem Rückenstreifen über der Wirbelsäule
#                            #      (zone_dorsal = Anteil der halben Rumpfbreite gesperrt, zone_dorsal_soft = weicher Rand)
# zone_leg_margin = 0.03     # Anteil H; tiefe Knie (Wolf) brauchen mehr (0.12), sonst harte Kante am Knie
# zone_dorsal = 0.35
# zone_dorsal_soft = 0.25
# spine_chain_blend = 1.0    # 0 = aus; Anteil der Wirbelkette (Hips…Neck_2) nach Lage ENTLANG der Kette verteilen,
#                            # lineare Rampe dieser Breite (in Knochenlängen) um jedes Gelenk; 1 = Mitte zu Mitte

# Skelett `upright` (rigging/upright_rig.py): aufrechter Zweibeiner mit langen Armen – Treant, Golem, Brute/Flesh Titan.
# Pro Kreatur überschreibbar in creature.toml unter [upright] (Unterabschnitte z. B. [upright.double_sided]).
# Längen sind Anteile der Höhe H (Boden → höchster Punkt), damit die Werte für jede Größe passen.

# --- Erkennung (rigging/upright_detect.py): waagerechte Schnitte durch das Mesh ---
cut_step = 0.01              # Abstand der Schnitte
ground_band = 0.02           # Vertices so nah am Boden gelten als Bodenkontakt (Füße). Hände müssen höher enden!
crotch_search_top = 0.6      # Schritt (Beine laufen zusammen) wird unterhalb dieser Höhe gesucht
leg_min_share = 0.2          # jedes Bein hat mindestens diesen Anteil der Bodenkontakt-Vertices
arm_min_span = 0.1           # ein Arm-Stück unterhalb des Schritts ist mindestens so hoch (sonst Moos, Zapfen …)
trunk_radius = 0.15          # Rumpf-Querschnitt: nur Schnittpunkte in diesem Umkreis zählen zur Mitte
crown = true                 # Krone suchen (Treant: Astkrone). false = Kreatur ohne Krone (Crown bleibt Platzhalter)
crown_min_above_armpit = 0.1 # Krone beginnt frühestens so weit über der Achsel (sonst zählen die Schultern)
crown_width_ratio = 2.0      # … dort, wo der Querschnitt so viel breiter ist als der Rumpf unter den Armen

# --- Gelenke an der Geometrie ---
hip_up = 0.03                # Hüftgelenk so weit über dem Schritt (im Becken)
knee_window = [0.3, 0.6]     # Knie = engste Stelle des Beins in diesem Bereich (Anteil Knöchel → Hüfte) …
knee_flat = 0.15            # ändert sich die Beindicke im Fenster um weniger als 15 %, gibt es keine Engstelle …
knee_mid = 0.45             # … dann sitzt das Knie hier (Anteil Knöchel → Hüfte)
knee_forward = 0.02          # Knie mindestens so weit vor der Linie Hüfte–Knöchel (IK knickt dann sicher nach vorn)
ankle_ratio = 1.3            # Knöchel = unterste Höhe, an der das Bein schmaler ist als ankle_ratio × typische Beindicke
ball_forward = 0.35          # Fußballen: Anteil von der Fußmitte zur vorderen Zehenspitze
ball_height = 0.03
shoulder_up = 0.05           # Schultergelenk so weit über der Achsel
shoulder_in = 0.85           # … und seitlich so weit wie die Arm-Mitte an der Achsel (Anteil vom Rumpf aus)
clavicle_in = 0.35           # Schlüsselbein beginnt so weit von der Rumpfmitte (Anteil Richtung Schulter)
elbow_window = [0.25, 0.75]  # Ellbogen = stärkste Biegung der Arm-Mittellinie (Anteil Schulter → Handgelenk)
wrist_ratio = 0.72           # Handgelenk = von der Hand aufwärts die Höhe, an der der Arm schmaler wird als wrist_ratio × Handbreite
knuckle_min_fingers = 3      # Fingeransatz = höchster Schnitt unter dem Handgelenk mit so vielen getrennten Fingern

# --- Gewichte ---
falloff = 4                  # 1/Abstand^falloff
smooth_iterations = 6        # Glätten über Mesh-Kanten (weiche Gelenkmanschetten)
smooth_factor = 0.5
leg_blend = 0.06             # Übergang Becken ↔ Oberschenkel: so weit über/unter dem Schritt
arm_blend = 0.05             # Übergang Brust ↔ Oberarm: so weit unter der Achsel
shoulder_radius = 0.08       # Rumpf-Vertices so nah am Schultergelenk dürfen am Arm (Schlüsselbein, Oberarm) hängen
foot_rigid = 0.04            # Fußsohle: alles bis zu dieser Höhe hängt nur an Foot/Toe (Bodenkontakt starr)
crown_blend = 0.04           # Übergang Brust ↔ Krone um die Kronen-Basis; Äste/Strähnen außerhalb des Rumpfs = 100 % Crown
crown_smooth = 6             # so oft wird der Kronen-Anteil über die Mesh-Kanten geglättet (weiche Ansätze am Stamm)
crown_core = 1.3             # Rumpf-Radius-Faktor: innerhalb gilt der weiche Übergang, außerhalb starr an der Krone
part_attach = 0.02           # lose Mesh-Teile (Moos, Pilze): Vertices so nah am Hauptmesh sind die Ansatzstelle

[double_sided]               # einseitige Flächen (Moos-Strähnen) doppelseitig machen (rigging/double_sided.py)
enabled = false
min_area = 0.002
offset = 0.001

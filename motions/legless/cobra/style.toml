# Bewegungsmuster legless/cobra – Schlangen mit aufrichtbarem Vorderkörper (Eel Stalker).
# Winkel in Grad. Bereiche (lo/hi) als Anteil der Körperlänge: 0 = Schwanzspitze, 1 = Kopfansatz.

[meta]
skeleton = "legless"
style = "cobra"
clip_prefix = "Legless_Cobra"
fps = 30
clips = ["Walk", "Run", "Idle", "Ready", "TurnLeft", "TurnRight", "Attack1", "Hit", "Death"]
inherit = { run = "walk", turn = "walk" }

[walk]   # laterale Undulation: Krümmungswelle läuft vom Kopf zum Schwanz
cycle_frames = 36
amp_deg = 22          # Ausschlag (Summe pro ~6 Wirbel)
waves = 1.3           # sichtbare Wellen über die Körperlänge
head_level = 0.8      # Kopf bleibt waagerecht + ruhig
front_raise_deg = 8   # Kopfpartie leicht erhoben

[run]
cycle_frames = 20
amp_deg = 30

[turn]
cycle_frames = 36
bias_deg = 50         # Körper krümmt sich zur Drehseite (Unity dreht das Objekt)

[idle]
frames = 90
amp_deg = 5
look_deg = 25
front_raise_deg = 12

[ready]  # Kobra-Drohhaltung: Vorderkörper aufgerichtet, S-Kurve, Kopf schaut nach vorn, Maul leicht offen
frames = 40
raise_lo = 0.75       # ab hier richtet sich der Körper auf (Naja: 13–22 % der Länge, Nasoori et al. 2016)
raise_deg = 70
s_curve_deg = 25      # Hals zurück in S-Form (Schlagbereitschaft)
sway_deg = 8
jaw_deg = 12

[attack1] # Zustoßen aus der S-Kurve nach vorn-unten, Maul weit auf → zuschnappen (hit) → zurück
frames = 26
windup_end = 10
strike_end = 14
hold_end = 18
raise_deg = 70
strike_lunge = 0.18   # Vorstoß nach vorn (Anteil Länge)
strike_drop = 0.55    # beim Stoß gibt der Körper so viel der Aufrichtung ab
strike_down_deg = 35  # Vorderkörper kippt beim Zustoßen nach vorn
jaw_open_deg = 20
hit_frame = 14

[hit]
frames = 12
recoil_deg = 30
jolt_deg = 20

[death]
frames = 40
collapse_end = 22
twist_deg = 60        # Körper verdreht sich, liegt dann schlaff

[checks]
ground_tolerance = 0.01
max_stretch = 1.9
stretch_every = 3

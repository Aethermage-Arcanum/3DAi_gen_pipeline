# Bewegungsmuster quadruped/lizard – Echse/Waran (Reef Snapper): Diagonal-Trab mit stehender S-Welle des Rumpfes
# (Schulter- und Beckengürtel gieren gegenläufig), Schwanz setzt die Welle fort, Drohen im Seitenprofil mit weit offenem
# Maul, Schnappbiss mit Kopfschwung. Generator: lizard_clips.py. Winkel in Grad, Längen als Anteil der Körperlänge
# (stride) bzw. Rumpfhöhe (lift, Höhen). Herleitung der Werte: README.md "Abgeleitete Werte".
[meta]
skeleton = "quadruped"
style = "lizard"
clip_prefix = "Quadruped_Lizard"
fps = 30
clips = ["Walk", "Run", "Idle", "Ready", "TurnLeft", "TurnRight", "Attack1", "Hit", "Death"]
inherit = { turn = "walk" }

[walk]   # Diagonal-Trab (Waran gehen): HL+VR, dann HR+VL
cycle_frames = 32
duty = 0.62
order = { BL = 0.0, FR = 0.0, BR = 0.5, FL = 0.5 }
foot_profile = "smooth"
swing_match = 0.7
lift_peak = 0.4
curl_peak = 0.3
stride = 0.18         # war 0,16
lift_front = 0.15
lift_back = 0.12
toe_curl_deg = 25
shoulder_yaw_deg = 9  # stehende S-Welle: Schultergürtel ±9°, Becken ±8° gegenläufig (Varanus: deutlich sichtbare Rumpfbiegung)
hip_yaw_deg = 8       # (vorher: spine_side 10° auf alle 3 Wirbel gleich verteilt = Körper drehte als Block um die Hüfte)
wave_lag = 0.05       # Welle läuft leicht nach hinten (Ritter 1992: bei höherem Tempo laufende Welle)
roll_deg = 2.5
bob = 0.012
sway = 0.006
head_gain = 0.5       # Kopf zeigt ruhiger nach vorn als die Schultern
neck_lag = 0.05
tail_lag = 0.08
tail_gain = 1.3
tail_lift_deg = 0
reach_smooth = 4
reach_flat = 0.3

[run]    # schneller Trab (Warane rennen im Trab, nicht im Galopp) mit größerer Welle
cycle_frames = 18
duty = 0.5
order = { BL = 0.0, FR = 0.0, BR = 0.5, FL = 0.5 }
foot_profile = "smooth"
swing_match = 0.6
lift_peak = 0.4
curl_peak = 0.3
stride = 0.22
lift_front = 0.18
lift_back = 0.15
toe_curl_deg = 30
shoulder_yaw_deg = 13
hip_yaw_deg = 12
wave_lag = 0.07
roll_deg = 3
bob = 0.015
sway = 0.008
head_gain = 0.5
neck_lag = 0.05
tail_lag = 0.08
tail_gain = 1.35
tail_lift_deg = 4     # Schwanz im Lauf leicht angehoben
reach_smooth = 3
reach_flat = 0.4

[turn]   # Körper biegt sich stark in die Kurve (Echsen drehen über die Wirbelsäule), Kopf führt, Schwanz folgt dem Bogen
cycle_frames = 28
duty = 0.6
turn_deg = 30
stride = 0.0
turn_bend_deg = 24
turn_head_deg = 24
turn_tail_deg = 20

[idle]   # tiefe Atmung, Kopf blickt in kurzen Rucken (weich abgebremst) umher, Schwanzspitze schlängelt träge
frames = 90
breathe_deg = 2.0
look_deg = 26
tail_deg = 6
reach_smooth = 3

[ready]  # Drohen: Seitenprofil (Rumpf gebogen), Hals hoch, Maul weit auf + Fauch-Stöße, Schwanz gespannt und peitschend
frames = 48
crouch = 0.0
arc_deg = 14          # Rumpfbogen zum Gegner
lean_deg = 4
pitch_deg = 3         # Brust leicht hoch
head_up_deg = 18
jaw_deg = 30          # war 13 (wegen Mundwinkel-Dehnung verkleinert) – Dehnung ist nur Info
hiss_jaw_deg = 8
tail_lash_deg = 10
tail_lift_deg = 6
reach_smooth = 4

[attack1] # Schnappbiss: Kopf/Hals holen zur Seite aus → Vorschnellen, Kopf schwingt zur Mitte, zuschnappen → zurückreißen
frames = 30
windup_end = 10
strike_end = 14
hit_frame = 14
crouch = 0.12
lunge = 0.10          # war 0,08
snap_yaw_deg = 26     # Kopfschwung von der Seite (war 18, nur am Kopf)
neck_reach_deg = 22
jaw_open_deg = 45
reach_smooth = 3

[hit]
frames = 15
jolt = 0.05
roll_deg = 7
head_deg = 28
reach_smooth = 2

[death]  # zur Seite kippen, Beine erschlaffen
max_stretch = 2.8      # Sichtprüfung ok: Unterarm beim Abrollen über die Seite, kein sichtbarer Riss
frames = 40
collapse_start = 4
collapse_end = 22
side = 1              # 1 = auf die rechte Seite
ik_release_start = 0.35
legs_limp_deg = 8    # Echse: Beine stehen seitlich ab, starkes Erschlaffen verdreht sie

[checks]
contact_tolerance = 0.012
planted_tolerance = 0.012
min_stride = 0.05
max_stretch = 1.9          # 1,8 → 1,9 nach Sichtprüfung: schlimmste Kanten direkt an Hüft-/Schultergelenk, im Bild unsichtbar
stretch_every = 3

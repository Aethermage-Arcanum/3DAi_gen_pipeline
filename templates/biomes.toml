# Zentrale Biom-Liste (seit 2026-11-18, Nutzer: „erweitere gern unsere Biome“).
# Für ein düsteres Top-down-ARPG. Varianten entstehen NICHT durch neue Generierungen, sondern über
# Tönung (Shader/Material-Instanz) + Anbauteile (Blender Geometry Nodes mit Slidern, starr am nächsten Knochen)
# + ggf. Element-Effekt (VFX + Schadensart). Schema: RECHERCHE_MONSTERARTEN.md §6.2.
#
# Felder:
#   label    deutscher Name (so heißt das Biom in Doku und Gesprächen)
#   mood     Stimmung in einem Satz (für Level-/Textur-Gestaltung und Prompt-Ideen)
#   palette  Tönung, dunkel → hell, Hex. Die Kreatur wird damit eingefärbt, Kontrast bleibt erhalten.
#   accent   Akzentfarbe (Augen, Risse, Rim-Light der Elite für Lesbarkeit von oben)
#   glow     Emissionsfarbe für glühende Risse/Punkte – "" = kein Glühen (Glühen nur im Shader, nie im Referenzbild)
#   surface  Oberflächen-Charakter für den Shader (Rauheit, Nässe, Staub, Frost)
#   addons   typische Anbauteile per Geometry Nodes (Slider: Dichte, Größe, Zufall)
#   effect   typischer Element-Effekt der Biom-Variante
#   texture  Schlüssel der Test-Textur in uv/biome_textures.py ("" = noch keine)
# Heimat-Biom und Varianten jeder Kreatur: creatures/roster.toml (Felder `biome`, `varianten`).

# --- bisherige Biome (aus der Concept Art bzw. der Recherche) -------------------------------


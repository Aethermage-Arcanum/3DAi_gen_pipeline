# Demo: EIN Grundkörper, sechs Varianten – nur über Slider + Farben.
# Slider-Namen = Namen im Blender-Modifier "Monster Anbauteile" (siehe addon_nodes.py).
# Nicht angegebene Slider behalten ihren Standardwert.

[[variant]]
label = "1 · Grundkörper (keine Anbauteile)"
body_color = [0.16, 0.30, 0.34]
settings = { "Stacheln An" = false, "Platten An" = false }

[[variant]]
label = "2 · Rückenkamm, wenige lange Stacheln"
body_color = [0.16, 0.30, 0.34]
spike_color = [0.75, 0.22, 0.18]
settings = { "Stachel Dichte" = 30.0, "Stachel Abstand" = 0.2, "Stachel Länge" = 0.55, "Stachel Breite" = 0.09, "Stachel Kammbreite" = 0.15, "Stachel Neigung" = 0.9 }

[[variant]]

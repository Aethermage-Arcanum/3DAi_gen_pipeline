spike_color = [0.85, 0.78, 0.60]
settings = { "Stachel Dichte" = 60.0, "Stachel Abstand" = 0.12, "Stachel Länge" = 0.2, "Stachel Breite" = 0.04, "Stachel Kammbreite" = 10.0, "Stachel Abdeckung" = 0.35, "Stachel Neigung" = 0.3 }

[[variant]]

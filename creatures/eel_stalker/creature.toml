# Bewegung: Skelett/Muster (motions/<skelett>/<muster>), Variante, Vorbild-Tiere für die
# Naturbeobachtung (Videos werden VOR dem Animieren dazu gesucht) – bitte prüfen/korrigieren
[motion]
style = "legless/cobra"
variant = "eel"
vorbild = ["Muräne – Vorschnellen aus der S-Kurve", "Kobra – aufgerichtete Drohhaltung", "Zitteraal – Schlängeln"]

# UV: Formel wählte Smart UV (1,30 vs. 1,91), Sichtprüfung spricht klar für Tripo: 163 statt 891 Inseln,
# 60 % der Teile am Stück, Nahtlänge 11,6 statt 30,3 × Größe. Tripo gibt dem Kopf mehr Auflösung, der Schwanz
# ist gröber – das bestraft die Formel zu stark (Dichte-Ausreißer). → Tripo-UV festlegen.
[uv]
mode = "tripo"

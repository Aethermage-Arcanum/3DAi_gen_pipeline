# Bog Warden – aus creatures/roster.toml erzeugt (Roster-Erweiterung 2026-11-18, OHNE Concept Art:
# das Design-Bild aus Stufe 1 ist der Design-Entwurf, der Nutzer prüft es).
# Heimat-Biom: Sumpf (swamp) · Rolle: Elite (Tank, Wurzel-Slam) · Beschreibung (look), Pose und Varianten: creatures/roster.toml · Biome: templates/biomes.toml
name = "bog_warden"
bodyplan = "upright"
style = "lowpoly_b"
description = "Bog Warden: hulking walking swamp tree with root legs, branch arms, a hollow face and a moss-draped crown"   # Fallback – die Beschreibung steht in roster.toml (look)

[[concept]]
file = "H:/AIProjects/3D AI/01_kreatur_pipeline/creatures/01_chitin_crawler/input/concept/2_style_lowpoly_insects_B.png"
role = "style"

# Bewegung: Skelett/Muster (motions/<skelett>/<muster>), Variante, Vorbild-Tiere für die
# Naturbeobachtung (Videos werden VOR dem Animieren dazu gesucht) – bitte prüfen/korrigieren
[motion]
style = "upright/treant"
variant = ""
vorbild = ["Baum im Sturm – Äste schwingen", "Elefantenrüssel – Ast-Peitsche", "Elefant – schwerer, langsamer Schritt"]

# Modellprüfung (scripts/model_check.py): gewollte Befunde, mit Begründung (Sichtprüfung BACKLOG G5, Rig 2026-11-18)
[model_check.freigabe]
mittellinie = "Natürlich krummer, gebückter Baumstamm mit schiefer Astkrone (Tripo-Modell = Design). Das Rig misst die Rumpf-Mitte pro Höhe an der echten Geometrie (upright_detect), die Clips geben die Haltung absolut vor (posture) – die Krümmung stört die Animation nicht."
symmetrie = "Astkrone, Moos-Strähnen und Baumpilze sind bewusst asymmetrisch (Baum, kein Tier). Rumpf, Arme und Beine sind paarig und werden je Seite eigenständig erkannt."

# Frei hängende Teile (rigging/dangling.py): Moos-Strähnen unter der Astkrone schwingen per Shader nach, ohne Knochen.
# Äste der Krone selbst bleiben starr (hängen zu 100 % an Crown): nur Vertices UNTERHALB der Kronen-Basis (below)
# und nur dünne Teile (thin_max) schwingen.
[dangling]
amplitude = 0.018
frequency = 0.6           # langsam, schwer (nasses Moos)
# G14/C13 (Nutzer 2026-11-22): zusätzlich Trägheit, Wackeln und Stöße im Shader (Schalter „Nachschwingen“ in
# Creature/Standard Dangling, gesetzt von VariantKit/Editor/VkDangleSwing.cs; Laufzeit-Komponente VariantSchwingen).
# Die zu knappe Markierung (nur Strähnen-Spitzen schwingen) ist ein eigener Schritt (BACKLOG C13).
nachschwingen = true
nachschwingen_laenge = 0.35   # Länge der Moos-Strähnen (m)
nachschwingen_feder = 2       # Feder am Kopf (die Krone hängt am Kopf)
[[dangling.region]]
bones = ["Crown"]
below = -0.02

# Rig (rigging/upright_rig.py): Moos-Strähnen sind bei Tripo einseitige Platten (model_check: 22 kleine offene
# Bereiche) → doppelseitig machen, sonst von hinten unsichtbar und für [dangling] ohne messbare Dicke.
[upright.double_sided]
enabled = true

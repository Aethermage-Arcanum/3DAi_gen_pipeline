# Needle Wasp – aus creatures/roster.toml erzeugt (docs/archiv/ROADMAP_20_KREATUREN.md)
name = "needle_wasp"
bodyplan = "hexapod"
style = "lowpoly_b"
# Lauf 1 sah aus wie eine Ameise mit Flügeln (dicke lange Beine, Mini-Flügel, Stachel unauffällig).
# Deshalb Proportionen hier ausdrücklich in Worten + Stil-Vorlage = B "Stalk Wasp" statt Ameisen-Insekten.
description = """Needle Wasp: a slender, aggressive forest WASP (clearly a wasp, NOT an ant). \
Proportions: narrow wasp waist (thin petiole) between thorax and a long pointed abdomen; \
the abdomen ends in a very long, sharp NEEDLE STINGER that is a key feature - big, clearly visible \
and highlighted in every view. TWO PAIRS of LARGE translucent wings, each wing about as long as the \
whole body, spread out to the sides in a flight-ready pose, clearly separated from the body and visible \
in every view. Six SHORT, THIN, delicate legs, much thinner than the abdomen, tucked slightly under \
the body like a hovering wasp. Large compound eyes, short antennae, small mandibles."""
design_pick = "Image 1 is a concept sheet of this wasp: the big creature is the design, the small panels show details (head, stinger, wings, eggs) and views."

[[concept]]
file = "input/concept/neelde_wasp.png"   # dein Concept-Blatt (scharf, mit Detail-Nahaufnahmen)
role = "design"

[[concept]]
file = "input/concept/style_B_stalk_wasp.png"
role = "style"

# Bewegung: Skelett/Muster (motions/<skelett>/<muster>), Variante, Vorbild-Tiere für die
# Naturbeobachtung (Videos werden VOR dem Animieren dazu gesucht) – bitte prüfen/korrigieren
[motion]
style = "flyer/wasp"   # fliegt: Schwebe-Rig (rigging/floater_rig.py) + Flügelschlag-Muster
variant = ""
vorbild = ["Wespe/Hornisse im Schwebeflug (Zeitlupe)", "Wespe beim Stechen – Hinterleib schnellt vor"]

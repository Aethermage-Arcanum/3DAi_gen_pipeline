# Bonepicker Vulture – aus creatures/roster.toml erzeugt (Roster-Erweiterung 2026-11-18, OHNE Concept Art:
# das Design-Bild aus Stufe 1 ist der Design-Entwurf, der Nutzer prüft es).
# Heimat-Biom: Gras/Steppe (steppe) · Rolle: Schwarm (kreist, Sturzflug) · Beschreibung (look), Pose und Varianten: creatures/roster.toml · Biome: templates/biomes.toml
name = "bonepicker_vulture"
bodyplan = "winged"
style = "lowpoly_b"
description = "Bonepicker Vulture: large ragged steppe vulture with bald red neck, bony beak and broad fingered wings"   # Fallback – die Beschreibung steht in roster.toml (look)

[[concept]]
file = "H:/AIProjects/3D AI/01_kreatur_pipeline/creatures/01_chitin_crawler/input/concept/2_style_lowpoly_insects_B.png"
role = "style"

# Bewegung: Skelett/Muster (motions/<skelett>/<muster>), Variante, Vorbild-Tiere für die
# Naturbeobachtung (Videos werden VOR dem Animieren dazu gesucht) – bitte prüfen/korrigieren
[motion]
style = "winged/bird"
variant = ""
vorbild = ["Gänsegeier kreist in der Thermik", "Habicht/Adler – Sturzflug mit Krallen", "Geier – Landung, Hüpfen und Hacken am Aas"]

# Rig (rigging/winged_rig.py, Skelett winged): Federspitzen (Hand- und Armschwingen, Halskrause) sind bei Tripo einseitig
# (model_check: 6 Bereiche, 332 Fl.) → doppelseitig. Lose Teile (Brustknochen-Platte, Halsknochen) hängen je Vertex am
# nächsten Haupt-Mesh-Vertex. Schnabel und Knochenkamm bleiben starr (Kopf/Kiefer).
[winged.double_sided]
enabled = true

# Frei hängende Teile (rigging/dangling.py): Halskrause + Brust-/Bauchfedern schwingen im Unity-Shader nach.
# Flügel-Federspitzen NICHT (sie folgen den Flügelknochen), Schnabel/Kamm/Knochen sind dick → bleiben starr.
[dangling]
amplitude = 0.015
frequency = 0.9
[[dangling.region]]
bones = ["Neck_1", "Neck_2", "Chest", "Spine_2"]

# Modellprüfung: gewollte Befunde (Sichtprüfung B, 2026-11-20, winged-Agent)
[model_check.freigabe]
offene_flaechen = "Federn einseitig → rigging/winged_rig.py macht sie doppelseitig ([winged.double_sided])"
boden = "Geier steht schräg vorgebeugt mit S-Hals; Schwerpunkt vor den Füßen ist gewollt (Referenzbild)"

is black-violet chitin with deep red highlights along the joints and plate edges. The head is small and pale, \
sitting at the front, with a single large orange-red eye and a jagged mouth. A few thin, whip-like feelers \
sweep back from the head. Materials: polished, sharp-edged chitin and metallic-looking blades."""
pose = "body level, standing on its four walking legs spread evenly to both sides, the two blade arms raised and held forward at their full length, free from the legs and the head"


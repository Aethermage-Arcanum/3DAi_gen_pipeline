look = """A creepy forest beetle that carries a huge fungal growth on its back - slow, heavy-laden, like a walking \
mushroom colony. The body is a compact, rounded beetle with a glossy dark red-brown carapace marked with a few \
thin pale stripes. The head is small and low at the front, with short mandibles and two thin, curled orange \
antennae. On top of the back sits a big, lumpy cluster of round spore pods like a heap of puffball mushrooms, \

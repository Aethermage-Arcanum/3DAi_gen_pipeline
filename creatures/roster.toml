# Alle Kreaturen aus der Concept Art (_concept/monster_progression_A_vs_B.webp) mit den Entscheidungen
# aus ROADMAP_20_KREATUREN.md §6. scripts/make_roster.py legt daraus Ordner + creature.toml + prompts.md an
# (bestehende creature.toml werden NIE überschrieben) und schreibt PROMPTS_ALLE.md.
# design = Name auf dem Concept-Sheet, artist = welche Version (A/B) als Design-Vorlage dient,
# cell = Position auf dem Sheet (Artist, Reihe, Spalte) für den Ausschnitt (scripts/concept_crops.py).
# motion = Skelett/Bewegungsmuster, variant = Variante des Musters, vorbild = echte Tiere, deren Videos
#   vor dem Animieren gesucht werden (BITTE PRÜFEN/KORRIGIEREN).
# hint = kurze Stütze (alt, nur noch Fallback für neue creature.toml).
# look = AUSFÜHRLICHE Beschreibung für die ChatGPT-Prompts (Englisch, seit 2026-11-18, BACKLOG A10): qualitativ –
#   Charakter/Wirkung, Silhouette, Körperbau, Kopf, Gliedmaßen (Anzahl ja), Schwanz, markante Merkmale, Farben pro
#   Körperbereich, Material. KEINE Zahlen/Maße/Verhältnisse (der KI Kreativität lassen). Nur, was im Concept zu sehen
#   ist bzw. dazu passt. Steht vorn und dominant in beiden Prompt-Stufen (scripts/make_prompts.py).
# pose = nur wenn die Neutralpose des Bauplans (templates/bodyplans.toml) nicht passt (z. B. Knöchelgang, Flügel).
# Das Concept-Sheet hat immer Vorrang. Ein `look`/`pose` in der creature.toml überschreibt den Wert hier.

sheet = "../_concept/monster_progression_A_vs_B.webp"
style_ref = "creatures/chitin_crawler/input/concept/2_style_lowpoly_insects_B.png"


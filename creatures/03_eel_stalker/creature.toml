# Eel Stalker – aus creatures/roster.toml erzeugt (docs/archiv/ROADMAP_20_KREATUREN.md)
name = "eel_stalker"
bodyplan = "serpentine"
style = "lowpoly_b"
description = "Eel Stalker: legless eel-like serpent from the coast, long body, head raised"
design_pick = "Recreate only the large creature in front; ignore the grey silhouettes, any text and the background of the concept."

[[concept]]
file = "input/concept/design_A.png"
role = "design"

[[concept]]
file = "H:/AIProjects/3D AI/01_kreatur_pipeline/creatures/01_chitin_crawler/input/concept/2_style_lowpoly_insects_B.png"
role = "style"

# Bewegung: Skelett/Muster (motions/<skelett>/<muster>), Variante, Vorbild-Tiere für die
# Naturbeobachtung (Videos werden VOR dem Animieren dazu gesucht) – bitte prüfen/korrigieren
[motion]
style = "legless/cobra"
variant = "eel"
vorbild = ["Muräne – Vorschnellen aus der S-Kurve", "Kobra – aufgerichtete Drohhaltung", "Zitteraal – Schlängeln"]

# UV: Formel wählte Smart UV (1,30 vs. 1,91), Sichtprüfung spricht klar für Tripo: 163 statt 891 Inseln,
# 60 % der Teile am Stück, Nahtlänge 11,6 statt 30,3 × Größe. Tripo gibt dem Kopf mehr Auflösung, der Schwanz
# ist gröber – das bestraft die Formel zu stark (Dichte-Ausreißer). → Tripo-UV festlegen.
[uv]
mode = "tripo"

# Frei hängende Teile (rigging/dangling.py, Backlog C7): die Hautlappen/Fühler UNTER Kopf und Hals schwingen in Unity
# per Shader frei (ohne Knochen). Kamm und Hörner oben bleiben starr (liegen über der Knochenlinie → nicht im Bereich),
# Zähne/kurze Zacken bleiben starr (kürzer als min_length). Prüfbild: rig/dangling_preview.png
[dangling]
amplitude = 0.025     # Ausschlag an der Spitze: 2,5 % der Länge ≈ 2,5 cm bei 1 m
[[dangling.region]]
bones = ["Head", "Jaw", "Spine_11", "Spine_12", "Spine_13", "Spine_14"]   # Kopf + vorderer Hals
below = 0.0           # nur unterhalb der Knochenlinie
